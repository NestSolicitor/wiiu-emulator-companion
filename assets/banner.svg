<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1424"/>
      <stop offset="55%" stop-color="#0f1f36"/>
      <stop offset="100%" stop-color="#122a45"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3ee6f5"/>
      <stop offset="100%" stop-color="#1a8fd1"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ee6f5" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#3ee6f5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="padFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c3352"/>
      <stop offset="100%" stop-color="#0d1c30"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1a2c"/>
      <stop offset="100%" stop-color="#173250"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#2a5c8a" stroke-width="1" opacity="0.18">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="330" y1="0" x2="330" y2="360"/>
    <line x1="510" y1="0" x2="510" y2="360"/>
    <line x1="690" y1="0" x2="690" y2="360"/>
    <line x1="870" y1="0" x2="870" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <circle cx="960" cy="130" r="230" fill="url(#glow)"/>

  <!-- Gamepad silhouette (Wii U style, right side) -->
  <g transform="translate(830,60)">
    <rect x="0" y="40" width="330" height="220" rx="42" fill="url(#padFace)" stroke="#3ee6f5" stroke-opacity="0.35" stroke-width="2"/>
    <!-- screen -->
    <rect x="45" y="72" width="240" height="150" rx="10" fill="url(#screenGrad)" stroke="#3ee6f5" stroke-width="2"/>
    <!-- screen glow lines -->
    <line x1="65" y1="100" x2="245" y2="100" stroke="#3ee6f5" stroke-opacity="0.5" stroke-width="3"/>
    <line x1="65" y1="130" x2="205" y2="130" stroke="#3ee6f5" stroke-opacity="0.3" stroke-width="3"/>
    <line x1="65" y1="160" x2="225" y2="160" stroke="#3ee6f5" stroke-opacity="0.2" stroke-width="3"/>
    <!-- analog sticks -->
    <circle cx="30" cy="90" r="16" fill="#0d1c30" stroke="#3ee6f5" stroke-width="2"/>
    <circle cx="300" cy="200" r="16" fill="#0d1c30" stroke="#3ee6f5" stroke-width="2"/>
    <!-- buttons -->
    <circle cx="300" cy="90" r="8" fill="#3ee6f5" opacity="0.8"/>
    <circle cx="322" cy="108" r="8" fill="#1a8fd1" opacity="0.8"/>
    <circle cx="278" cy="108" r="8" fill="#1a8fd1" opacity="0.6"/>
    <!-- d-pad -->
    <rect x="24" y="192" width="12" height="36" fill="#3ee6f5" opacity="0.7"/>
    <rect x="12" y="204" width="36" height="12" fill="#3ee6f5" opacity="0.7"/>
  </g>

  <!-- floating pixel particles -->
  <g fill="#3ee6f5">
    <rect x="760" y="50" width="8" height="8" opacity="0.6"/>
    <rect x="1150" y="90" width="6" height="6" opacity="0.4"/>
    <rect x="1120" y="300" width="10" height="10" opacity="0.5"/>
    <rect x="740" y="290" width="7" height="7" opacity="0.5"/>
    <circle cx="1180" cy="200" r="4" opacity="0.5"/>
    <circle cx="800" cy="330" r="3" opacity="0.4"/>
  </g>

  <!-- decorative circuit lines left/bottom -->
  <g stroke="#1a8fd1" stroke-width="2" fill="none" opacity="0.35">
    <path d="M60 300 L120 300 L120 270 L200 270"/>
    <path d="M60 250 L90 250 L90 220"/>
    <circle cx="120" cy="270" r="3" fill="#3ee6f5"/>
    <circle cx="200" cy="270" r="3" fill="#3ee6f5"/>
    <circle cx="90" cy="220" r="3" fill="#3ee6f5"/>
  </g>

  <!-- headline -->
  <text x="60" y="165" font-family="'Segoe UI', Arial, sans-serif" font-size="92" font-weight="700" fill="#f2fbff" textLength="330" lengthAdjust="spacingAndGlyphs">Cemu</text>

  <!-- underline accent -->
  <rect x="62" y="185" width="260" height="6" rx="3" fill="url(#cyan)"/>

  <!-- tagline -->
  <text x="60" y="230" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#a9c7de" textLength="700" lengthAdjust="spacingAndGlyphs">
    Free, open-source Wii U emulator — first released Oct 13, 2015
  </text>
  <text x="60" y="262" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#a9c7de" textLength="760" lengthAdjust="spacingAndGlyphs">
    for Windows. Cemu 2.1 (2024) brought stable Linux &amp; macOS support.
  </text>

  <!-- small tag pills -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#0b1424">
    <rect x="62" y="284" width="90" height="28" rx="14" fill="#3ee6f5"/>
    <text x="76" y="303">Windows</text>
    <rect x="162" y="284" width="72" height="28" rx="14" fill="#1a8fd1"/>
    <text x="176" y="303">Linux</text>
    <rect x="244" y="284" width="80" height="28" rx="14" fill="#3ee6f5" opacity="0.85"/>
    <text x="258" y="303">macOS</text>
  </g>
</svg>